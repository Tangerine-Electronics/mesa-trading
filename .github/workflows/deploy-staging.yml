name: deploy-staging

on:
  workflow_dispatch:
  push:
    branches: [main, cursor/a26-cycles-5bf0]

permissions:
  contents: read
  id-token: write

concurrency:
  group: mesa-trading-staging
  cancel-in-progress: false

env:
  GCP_PROJECT: tangerine-staging-510423
  GCP_REGION: northamerica-south1
  DEPLOYER_SA: sa-forge-staging@tangerine-staging-510423.iam.gserviceaccount.com
  WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Aplicar staging
        run: bash scripts/staging-apply.sh

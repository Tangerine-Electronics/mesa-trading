[project]
name = "mesa-trading"
version = "0.1.0"
description = "Mesa de trading 24/7 con dinero simulado. Sin ruta a dinero real."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.6",
  "pyyaml>=6",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "hypothesis>=6.100",
  "pytest>=8.3",
  "pytest-cov>=5.0",
]

[project.scripts]
mesa-tick = "mesa_trading.cli.tick:main"
mesa-report = "mesa_trading.cli.report:main"
mesa-api = "mesa_trading.cli.api:main"
mesa-judge = "mesa_trading.cli.judge:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=mesa_trading.policy --cov=mesa_trading.risk --cov=mesa_trading.state --cov=mesa_trading.broker --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = false
source = ["mesa_trading"]
